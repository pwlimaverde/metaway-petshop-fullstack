<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Arial, sans-serif; fill: #111827; }
      .entity-title { font: 700 20px Arial, sans-serif; fill: #111827; }
      .field { font: 14px Consolas, "Courier New", monospace; fill: #1f2937; }
      .card { font: 600 12px Arial, sans-serif; fill: #374151; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .header { fill: #e5e7eb; stroke: #111827; stroke-width: 2; }
      .line { stroke: #374151; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="40" y="50" class="title">Metaway Petshop - Data Model (Atual)</text>
  <text x="40" y="80" class="subtitle">Fonte: docs/PRD.md (Secao 8)</text>

  <!-- USERS -->
  <rect x="560" y="120" width="420" height="250" class="box"/>
  <rect x="560" y="120" width="420" height="50" class="header"/>
  <text x="730" y="152" text-anchor="middle" class="entity-title">USERS</text>
  <text x="580" y="195" class="field">id (PK)</text>
  <text x="580" y="218" class="field">cpf (UNIQUE, NOT NULL)</text>
  <text x="580" y="241" class="field">role (ADMIN | CLIENTE)</text>
  <text x="580" y="264" class="field">password_hash</text>
  <text x="580" y="287" class="field">client_id (FK, UNIQUE, nullable for ADMIN)</text>
  <text x="580" y="310" class="field">name (required for ADMIN)</text>
  <text x="580" y="333" class="field">created_at, updated_at</text>

  <!-- CLIENTS -->
  <rect x="560" y="430" width="420" height="185" class="box"/>
  <rect x="560" y="430" width="420" height="50" class="header"/>
  <text x="770" y="462" text-anchor="middle" class="entity-title">CLIENTS</text>
  <text x="580" y="505" class="field">id (PK)</text>
  <text x="580" y="528" class="field">name</text>
  <text x="580" y="551" class="field">photo_url</text>
  <text x="580" y="574" class="field">created_at, updated_at</text>

  <!-- ADDRESSES -->
  <rect x="1160" y="250" width="420" height="270" class="box"/>
  <rect x="1160" y="250" width="420" height="50" class="header"/>
  <text x="1370" y="282" text-anchor="middle" class="entity-title">ADDRESSES</text>
  <text x="1180" y="325" class="field">id (PK)</text>
  <text x="1180" y="348" class="field">client_id (FK)</text>
  <text x="1180" y="371" class="field">logradouro, numero, complemento</text>
  <text x="1180" y="394" class="field">bairro, cidade, estado, cep</text>
  <text x="1180" y="417" class="field">tag</text>
  <text x="1180" y="440" class="field">created_at, updated_at</text>

  <!-- CONTACTS -->
  <rect x="100" y="250" width="420" height="230" class="box"/>
  <rect x="100" y="250" width="420" height="50" class="header"/>
  <text x="310" y="282" text-anchor="middle" class="entity-title">CONTACTS</text>
  <text x="120" y="325" class="field">id (PK)</text>
  <text x="120" y="348" class="field">client_id (FK)</text>
  <text x="120" y="371" class="field">tag</text>
  <text x="120" y="394" class="field">tipo (EMAIL | TELEFONE)</text>
  <text x="120" y="417" class="field">valor</text>
  <text x="120" y="440" class="field">created_at, updated_at</text>

  <!-- BREEDS -->
  <rect x="1320" y="770" width="350" height="180" class="box"/>
  <rect x="1320" y="770" width="350" height="50" class="header"/>
  <text x="1495" y="802" text-anchor="middle" class="entity-title">BREEDS</text>
  <text x="1340" y="845" class="field">id (PK)</text>
  <text x="1340" y="868" class="field">descricao (UNIQUE)</text>
  <text x="1340" y="891" class="field">created_at, updated_at</text>

  <!-- PETS -->
  <rect x="600" y="740" width="420" height="240" class="box"/>
  <rect x="600" y="740" width="420" height="50" class="header"/>
  <text x="810" y="772" text-anchor="middle" class="entity-title">PETS</text>
  <text x="620" y="815" class="field">id (PK)</text>
  <text x="620" y="838" class="field">client_id (FK)</text>
  <text x="620" y="861" class="field">breed_id (FK)</text>
  <text x="620" y="884" class="field">name, birth_date, photo_url</text>
  <text x="620" y="907" class="field">created_at, updated_at</text>

  <!-- APPOINTMENTS -->
  <rect x="100" y="760" width="420" height="230" class="box"/>
  <rect x="100" y="760" width="420" height="50" class="header"/>
  <text x="310" y="792" text-anchor="middle" class="entity-title">APPOINTMENTS</text>
  <text x="120" y="835" class="field">id (PK)</text>
  <text x="120" y="858" class="field">pet_id (FK)</text>
  <text x="120" y="881" class="field">descricao, valor, data</text>
  <text x="120" y="904" class="field">status (enum, default AGENDADO)</text>
  <text x="120" y="927" class="field">created_at, updated_at</text>

  <!-- Relationships -->
  <path d="M 770 370 L 770 430" class="line"/>
  <text x="790" y="405" class="card">USERS 1 -> 0..1 CLIENTS</text>

  <path d="M 980 520 L 1160 385" class="line"/>
  <text x="1030" y="455" class="card">CLIENTS 1 -> N ADDRESSES</text>

  <path d="M 560 520 L 520 390" class="line"/>
  <text x="335" y="520" class="card">CLIENTS 1 -> N CONTACTS</text>

  <path d="M 770 615 L 810 740" class="line"/>
  <text x="835" y="685" class="card">CLIENTS 1 -> N PETS</text>

  <path d="M 1020 860 L 1320 860" class="line"/>
  <text x="1105" y="840" class="card">PETS N -> 1 BREEDS</text>

  <path d="M 600 860 L 520 860" class="line"/>
  <text x="395" y="840" class="card">PETS 1 -> N APPOINTMENTS</text>
</svg>
